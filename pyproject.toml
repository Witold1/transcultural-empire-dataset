[project]
name = "transcultural-empire-dataset"
version = "0.1.0"
requires-python = ">=3.10"
description = "Prep scripts for the Transcultural Empire census GIS explorer"

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["scripts"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "I",   # isort
  "UP",  # pyupgrade
  "B",   # bugbear
  "SIM", # simplify
]

[tool.ruff.format]
quote-style = "double"
